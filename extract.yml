name: Extract ZIP

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o NEW_DUBAI_ATELIER_SIGNATURE_v1.5_FIXED.zip -d .
          rm NEW_DUBAI_ATELIER_SIGNATURE_v1.5_FIXED.zip

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract ZIP files" || echo "No changes"
          git push
