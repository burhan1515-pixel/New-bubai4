
name: Extract ZIP Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Extract ZIP
        run: |
          ZIP_FILE="NEW_DUBAI_ATELIER_SIGNATURE_v1.5_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found!"
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d extracted
          rm "$ZIP_FILE"

          cp -a extracted/. .
          rm -rf extracted

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -- .github/workflows/build.yml

          git commit -m "Extract ZIP files" || exit 0
          git push origin HEAD:main
          
