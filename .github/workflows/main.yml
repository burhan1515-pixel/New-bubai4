name: Extract ZIP Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o NEW_DUBAI_ATELIER_SIGNATURE_v1.5_FIXED.zip -d .
          rm NEW_DUBAI_ATELIER_SIGNATURE_v1.5_FIXED.zip

      - name: Commit Extracted Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract ZIP files" || exit 0
          git push
          
